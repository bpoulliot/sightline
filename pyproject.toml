[project]
name = "sightline"
version = "0.1.0"
description = "Automated first pass over Canvas courses against an online-course review rubric"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "jinja2>=3.1",
    "sqlalchemy>=2.0",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "structlog>=24.4",
    "httpx>=0.27",
    # Course exports are instructor-authored XML from outside this process. defusedxml is what
    # the reused AccessLens acquisition layer parses manifests with, and the reason is the same
    # here: entity expansion in an untrusted document should not be a denial of service.
    "defusedxml>=0.7",
    "cryptography>=43.0",
    "python-multipart>=0.0.12",
    # Rubric packs are hand-authored YAML, so comments matter and the format has to be one a
    # non-programmer can edit (SPEC §04). PyYAML reads them; the loader only ever calls safe_load.
    "pyyaml>=6.0",
    # The pack schema is a JSON Schema committed at src/sightline/rubric/pack.schema.json, and it
    # is validated against rather than reimplemented: a schema nothing checks drifts from the
    # loader within a release, and the error this library raises already names the offending path.
    "jsonschema>=4.23",
    # The rubric importer reads the committed workbooks. Note that one of them does not open in
    # openpyxl's default mode at all (SPEC §03) — see sightline.rubric.importer for what that
    # costs and what is done about it.
    "openpyxl>=3.1",
    "weasyprint>=70,<71",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
    "black>=24.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sightline"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM"]

[tool.ruff.lint.isort]
# tests/canvas_recordings.py is the suite's own fixture harness, imported by test modules the way
# the package is. Without this, isort files it under third-party and the grouping flips depending
# on which other imports a test happens to have.
known-first-party = [
    "sightline",
    "canvas_recordings",
    "detector_fixtures",
    "ollama_recordings",
    "voice_fixtures",
]

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["error::DeprecationWarning:sightline.*"]
