name: CI

on:
  pull_request:
  push:
    branches: [main]

# Five jobs, and they are deliberately five rather than one. `lint` and `format` are separate so
# that black can fail on its own and be seen to fail: chaining `ruff && black` behind one step
# means the exit code that survives is the last one, and a black failure has hidden behind that
# before now.
#
# Runner labels (~/docker TODO I226): a job that needs nothing from the host runs on `lan`
# (chromaserv or casper, the two runners on the LAN); `image` needs chromaserv's docker-in-docker
# socket and runs on `cserv`, the label only chromaserv carries. Never `portable`: an off-site
# runner carries it.
#
# Both labels map to node:20 (Debian bookworm, Python 3.11), which is older than this
# package requires, so every Python job bootstraps CPython 3.12 through uv rather than apt.

env:
  UV_VERSION: "0.9.5"

jobs:
  lint:
    runs-on: lan
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        run: |
          curl -LsSf "https://astral.sh/uv/${UV_VERSION}/install.sh" | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Install project
        run: uv sync --frozen --extra dev --python 3.12
      - name: ruff
        run: uv run ruff check .

  format:
    runs-on: lan
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        run: |
          curl -LsSf "https://astral.sh/uv/${UV_VERSION}/install.sh" | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Install project
        run: uv sync --frozen --extra dev --python 3.12
      - name: black
        run: uv run black --check .

  test:
    runs-on: lan
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        run: |
          curl -LsSf "https://astral.sh/uv/${UV_VERSION}/install.sh" | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Install project
        run: uv sync --frozen --extra dev --python 3.12
      # The native text stack WeasyPrint needs to render the PDF report (the Dockerfile's PDF_LIBS).
      # This job runs on the runner's own image, not the dev image, so its pango and harfbuzz are
      # a different release from the image's: tests/test_sample_report.py skips its byte
      # comparison here, and the image job below runs it in the dev image, where it must pass.
      - name: Install the PDF libraries
        run: |
          apt-get update
          apt-get install -y --no-install-recommends libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz-subset0 libfontconfig1
      - name: pytest
        run: uv run pytest -q
      # Run again, alone, for the same reason lint and format are separate jobs: a guard folded
      # into a hundred other results is a guard nobody reads. `-s` prints the counts it measured,
      # so the log says how many detectors are registered and how many have a fixture test behind
      # them rather than saying "passed". A detector added with no test fails here by name.
      - name: Detector integrity guard
        run: uv run pytest tests/test_detector_integrity.py -q -s

  # Not decoration on a public repository. A secret committed once is a secret burned, and git
  # history keeps it after a later deletion — hence the full-depth fetch.
  secrets:
    runs-on: lan
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install gitleaks
        run: |
          curl -LsSf -o /tmp/gitleaks.tar.gz \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          install /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version
      - name: Scan
        # FORBIDDEN_HOST_RE is a repository secret: a regular expression matching hostnames that
        # must never appear in the tree. The real Canvas hostname lives there and nowhere else.
        # With it unset the script reports the hostname check as SKIPPED and still runs the other
        # two, rather than passing quietly.
        env:
          FORBIDDEN_HOST_RE: ${{ secrets.FORBIDDEN_HOST_RE }}
        run: |
          git config --global --add safe.directory "$PWD"
          ./scripts/scan-secrets.sh

  # A Dockerfile that is never built in CI rots within a month. This job builds it and then starts
  # it, because an image that builds but cannot serve its own health endpoint has not been tested.
  image:
    runs-on: cserv
    container:
      image: node:20
      # The runner creates job containers against an isolated docker-in-docker daemon; this mounts
      # that daemon's socket so the job can build. It is not the host daemon. Only chromaserv's
      # runner allows the mount (its `valid_volumes`), hence `cserv`.
      options: -v /var/run/docker.sock:/var/run/docker.sock
    steps:
      - uses: actions/checkout@v4
      - name: Install the docker CLI
        run: |
          curl -fsSL -o /tmp/docker.tgz \
            https://download.docker.com/linux/static/stable/x86_64/docker-27.5.1.tgz
          tar -xzf /tmp/docker.tgz -C /tmp
          install /tmp/docker/docker /usr/local/bin/docker
          docker version
      - name: Build the runtime image
        run: docker build --target runtime -t "sightline:ci-${GITHUB_SHA}" .
      - name: Build the dev image
        # scripts/dev.sh runs tests, lint and format out of this stage, so it has to build too.
        run: docker build --target dev -t "sightline:ci-dev-${GITHUB_SHA}" .
      - name: The committed sample report re-renders byte for byte in the dev image
        # The environment the sample was made in. SIGHTLINE_SAMPLE_REPORT_REQUIRED is set in that
        # stage, so the comparison fails there rather than skips. Named, and removed first and in
        # the cleanup step, because cancelling the job kills the `docker run` client and leaves the
        # container running on the shared daemon (roadmap item 41). Per SHA because nothing cancels
        # a run automatically; a `concurrency` block with cancel-in-progress would need a per-ref
        # name instead. The memory limit is about 2.6 times the measured peak (item 41), swap off.
        run: |
          set -eu
          name="sightline-ci-sample-${GITHUB_SHA}"
          docker rm -f "$name" >/dev/null 2>&1 || true
          docker run --rm --name "$name" --memory 512m --memory-swap 512m \
            "sightline:ci-dev-${GITHUB_SHA}" pytest -q -rs tests/test_sample_report.py
      - name: The image starts and answers its own health endpoint
        # The one health check (scripts/image-healthcheck.sh); release.yml runs it too, on the
        # image it is about to publish (roadmap item 49).
        run: ./scripts/image-healthcheck.sh "sightline:ci-${GITHUB_SHA}" "sightline-ci-${GITHUB_SHA}"
      - name: Clean up the containers and images this job created
        if: always()
        run: |
          docker rm -f "sightline-ci-sample-${GITHUB_SHA}" "sightline-ci-${GITHUB_SHA}" || true
          docker image rm -f "sightline:ci-${GITHUB_SHA}" "sightline:ci-dev-${GITHUB_SHA}" || true
