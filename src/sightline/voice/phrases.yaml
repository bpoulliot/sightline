# THE PHRASE BANK. THIS IS SIGHTLINE'S VOICE, AND THIS IS THE FILE TO EDIT.
#
# Every sentence Sightline writes about a course is assembled from an entry here. There is no other
# source of English about a finding in the codebase (roadmap item 15), and a sentence a language
# model composed never reaches a report: the model locates quotes, and the quotes are placed into
# these sentences exactly as the course wrote them.
#
# HOW IT IS ORGANISED. By tier, then by the shape of the fact being stated. The tier sets the
# register (SPEC §08):
#
#   A  declarative. States the count and where it is. No hedge.
#   B  attributed to evidence. Quotes the source and names what was searched.
#   C  poses the question, presents the distribution, and hands the call to the reviewer.
#   D  states a limit plainly.
#
# Under each shape is a list of VARIANTS that say the same thing in different words. Which variant a
# sentence uses is fixed by the row's criterion code and the finding it describes — never by chance,
# the clock, or how many sentences came before it — so the same course reviewed twice reads the same,
# and fixing one finding changes the wording of that finding only.
#
# RULES FOR EDITING A VARIANT, ALL CHECKED WHEN THE BANK LOADS:
#
#   * Every variant of a shape uses exactly the same {placeholders}. Variety is in how a fact is
#     introduced, never in which facts are stated: a variant that drops {examined} has dropped the
#     count that tells a detector that passed from one that broke.
#   * Counts arrive with their noun already attached ("41 artifacts", "1 check"), from `nouns` below.
#   * Nothing in `register.yaml`'s lists may appear: no hedge in Tier A or D, no verdict in Tier C,
#     no grading vocabulary and no whole-course judgement anywhere. Every Tier C variant hands the
#     call to the reviewer in so many words.
#
# Placeholders: {code} is the criterion's own code as printed on the instrument, never renumbered.
# {label} is the instrument's own word for a rating. {title}, {quote}, {observed} and {evidence} are
# the course's or a detector's words, inserted verbatim. {place} is where in the course.

# Singular, plural. A count is rendered as "1 artifact" or "3 artifacts".
nouns:
  artifact: [artifact, artifacts]
  check: [check, checks]
  item_of_interest: [item of interest, items of interest]
  observation: [observation, observations]
  passage: [passage, passages]
  quote: [quote, quotes]
  row: [row, rows]
  unreadable: [item could not be read, items could not be read]
  item: [item, items]
  question: [question, questions]

# What each kind of Canvas artifact is called in a count ("3 pages, 1 syllabus").
kinds:
  course: [course setting, course settings]
  module: [module, modules]
  module_item: [module item, module items]
  page: [page, pages]
  assignment: [assignment, assignments]
  quiz: [quiz, quizzes]
  discussion: [discussion, discussions]
  announcement: [announcement, announcements]
  file: [file, files]
  embed: [embedded item, embedded items]
  syllabus: [syllabus, syllabuses]
  outcome: [outcome, outcomes]

# Fixed formats. Pieces of a sentence rather than sentences, so they do not rotate. They are linted
# like everything else, in the register given.
formats:
  place: {register: A, text: "{title}"}
  place_within: {register: A, text: "{title}, {within}"}
  place_line: {register: A, text: "{title}, line {line}"}
  place_within_line: {register: A, text: "{title}, {within}, line {line}"}
  list_separator: {register: A, text: ", "}
  kind_count: {register: C, text: "{quotes} from {artifacts}"}
  strong_item: {register: A, text: "{code} ({examined} examined)"}
  work_group: {register: A, text: "{label}: {codes}"}
  work_separator: {register: A, text: "; "}
  first_item: {register: A, text: "{code} ({priority}, {label})"}
  no_priority: {register: A, text: "no priority flag on the instrument"}
  heading_strong: {register: A, text: "What is strong"}
  heading_work: {register: A, text: "What needs work"}
  heading_first: {register: A, text: "What to do first"}
  heading_limits: {register: D, text: "What Sightline could not determine"}
  # The workbook's effort and near-boundary cells (roadmap item 13). An effort figure is always
  # called an estimate, and says which cost table it came from.
  effort_placeholder: {register: A, text: "{hours}, an estimate from the uncalibrated placeholder cost table"}
  effort_calibrated: {register: A, text: "{hours}, an estimate from the calibrated cost table"}
  near_boundary: {register: A, text: "{hours} is {distance} from the {below} / {above} threshold at {threshold} (margin {margin})"}
  action_plan_more: {register: A, text: "{lines} further lines for {code} are on the Action Plan sheet."}
  # How often independent human reviewers choose the same rating (roadmap item 24). Every figure
  # comes from `agreement.yaml` through `sightline.voice.agreement`; no number is typed here. These
  # are statements about PEOPLE AGREEING WITH EACH OTHER — the difficulty of the task — and never
  # about Sightline: the `self_assessment` rule refuses a figure in a sentence that names it.
  # `agreement_range` and `agreement_scope` are the short form the PDF and the review screen carry;
  # the rest are the long form the README carries. A limit is never left out of either.
  agreement_range: {register: A, text: "Human reviewers rating the same course independently chose the same rating on {low} to {high} of the criteria both rated, across {pairs} pairings of passes in a corpus of {courses} courses, and every disagreement between them was one band apart."}
  agreement_scope: {register: A, text: "That is a measure of how hard the task is, not of how often Sightline is right: {courses} courses is a small sample, and {majors} Major Revision ratings among {instances} say nothing about where the Major Revision threshold falls."}
  agreement_pair: {register: A, text: "{passes}: {rated} criteria rated by both, the same rating chosen on {identical} of them."}
  agreement_disagreements: {register: A, text: "Every one of the {disagreements} disagreements was exactly one band apart, and {at_lowest} of them set Sufficiently Present against Minor Revision; none set Major Revision against Sufficiently Present."}
  agreement_limit_small_sample: {register: A, text: "{courses} courses is a small sample, not a survey."}
  agreement_limit_major_boundary: {register: A, text: "Only {majors} of the {instances} ratings were Major Revision, so this corpus cannot characterise the Major Revision boundary, and no statement here rests on it."}
  agreement_limit_pairings_differ: {register: A, text: "The {pairs} figures are separate measurements, not one statistic: the pairs combine different roles, and one is two passes by the same role on a later revision of the instrument."}
  agreement_source: {register: A, text: "Measured {measured} from {courses} hand-completed reviews on the {instrument} instrument, {instances} rated criterion instances in all; the reviews themselves are not part of this repository."}
  # The near-boundary marker's one explanation, for the surface where a reader first meets it. The
  # marker is a computed distance from a threshold; this says which margins were applied and why
  # the lowest one is wider. It is never a percentage, a star or a word about how sure anything is.
  # The marker where it sits beside a proposal on its own line (a compact line of the PDF), named so
  # it reads as a fact about the proposal's estimated hours and never about a reviewer's rating.
  near_boundary_fact: {register: A, text: "Near a band threshold: {marker}"}
  near_boundary_legend: {register: A, text: "A proposal marked near a band threshold has estimated hours within {between} of a threshold between two bands, or within {lowest} of the Sufficiently Present / Minor Revision boundary; that margin is wider because {at_lowest} of the {disagreements} disagreements between human reviewers fell at that boundary."}
  # The PDF course report (roadmap item 14). One document for the instructional designer, written so
  # it can be forwarded to the instructor unchanged: every word here is read by both.
  report_title: {register: A, text: "{course}: a review pass against {instrument}"}
  report_instrument: {register: A, text: "Reviewed against {instrument}, version {version}"}
  report_opened: {register: A, text: "Review opened {date}"}
  report_about: {register: A, text: "This is a first review pass over the course materials in Canvas against {instrument}, prepared for the instructional designer and written so it can be shared with the instructor as it stands. It reviews materials, not the instructor or their teaching. A proposed rating names an amount of revision effort in the instrument's own bands; it is not a measure of how well anything is taught. Criteria that call for pedagogical judgement are posed as questions for the reviewer and carry no proposed rating, and no figure is computed for the course as a whole."}
  report_full_heading: {register: A, text: "{title}, in full"}
  report_compact_intro: {register: A, text: "One line for each remaining criterion: its proposed reading, what was located, and where in Canvas. Every criterion, with every located item and its Canvas link, is in the workbook {workbook} that accompanies this document."}
  report_running: {register: A, text: "{course} · {instrument}"}
  # Where a reviewer recorded a rating (roadmap item 16, operator decision Q2 of 2026-10-29), the
  # exports carry it labelled as the reviewer's, beside the proposal, which is never re-banded. The
  # proposal is then labelled as proposed in the same place, so neither can be read as the other.
  report_proposed_reading: {register: A, text: "Proposed: {label}"}
  report_reviewer_reading: {register: A, text: "Reviewer's rating: {label}"}
  # The review screen (roadmap item 16). Every word on it is a bank entry, linted like the reports:
  # the screen is where a designer reads the review, so it is held to the same register.
  review_unresolved_count: {register: A, text: "{questions} with no rating recorded"}
  review_jump: {register: A, text: "First question with no rating recorded: {code}, in {title}"}
  review_recorded: {register: A, text: "{rating}, recorded by {reviewer} on {date}"}
  review_note: {register: A, text: "Note: {note}"}
  review_records_as: {register: A, text: "A rating recorded here is recorded as {reviewer}. The name is set under Reviewer on the Settings screen."}
  review_saved: {register: A, text: "Recorded for {code}: {rating}."}
  review_choose_question: {register: C, text: "Nothing was recorded for {code}, because no rating was chosen. Choose one, No Response included; the call is yours to decide."}
  review_shown: {register: A, text: "{rows} shown"}
  review_previous: {register: A, text: "Previous: {title}"}
  review_next: {register: A, text: "Next: {title}"}

# Fixed words with no placeholders: sheet names, column headers, and the values of the workbook's
# categorical columns (roadmap item 13). Linted at load like everything else — a column header is
# exactly where "Score", "Grade", "Points" or "Overall" would slip in because it "isn't prose".
#
# THE THREE COVERAGE LABELS MUST STAY THREE, and none may read like a clean result: a row no check
# examined and a row with no check assigned are different facts from a row that was checked, and
# only the Proposed rating column can say Sufficiently Present.
labels:
  sheet_criteria: {register: A, text: "Criteria"}
  sheet_action_plan: {register: A, text: "Action Plan"}
  col_category: {register: A, text: "Category"}
  col_code: {register: A, text: "Code"}
  col_criterion: {register: A, text: "Criterion"}
  col_priority: {register: A, text: "Priority"}
  col_determinacy: {register: A, text: "Determinacy"}
  col_coverage: {register: A, text: "Coverage"}
  col_rating: {register: A, text: "Proposed rating"}
  col_effort: {register: A, text: "Estimated effort"}
  col_near_boundary: {register: A, text: "Near a band threshold"}
  col_evidence: {register: A, text: "Evidence"}
  col_action_plan: {register: A, text: "Action plan"}
  col_link: {register: A, text: "Canvas link"}
  col_link_kind: {register: A, text: "Link"}
  tier_A: {register: A, text: "A: computed by a parser, stated as a count"}
  tier_B: {register: B, text: "B: evidence located in the course, quoted"}
  tier_C: {register: C, text: "C: a judgement, posed as a question for the reviewer"}
  tier_D: {register: D, text: "D: not determinable from course materials"}
  coverage_deterministic: {register: A, text: "Bound to a check that is part of this review"}
  coverage_not_yet_implemented: {register: D, text: "Not examined: the bound capability has no check yet"}
  coverage_no_deterministic_coverage: {register: D, text: "No check assigned: evidence is located and quoted instead"}
  effort_none: {register: A, text: "No effort figure: this reading is not a revision band"}
  near_none: {register: A, text: "Not within the margin of a band threshold"}
  near_not_banded: {register: A, text: "No effort figure to measure from"}
  action_none: {register: A, text: "No located item or question for this row; the Evidence column states what was examined."}
  link_item: {register: A, text: "Item link"}
  link_search: {register: A, text: "Search link: the item has no stable id"}
  link_none: {register: A, text: "No Canvas location: this line is about the whole row"}
  # The PDF course report's fixed words (roadmap item 14). The four block headings are the four
  # visual channels of SPEC §02's presentation constraint, one per register, and each is read in its
  # own register: a Tier A count and a Tier C question never share one.
  report_about_heading: {register: A, text: "What this document is"}
  report_summary_heading: {register: A, text: "Proposed readings by category"}
  report_summary_intro: {register: A, text: "Each cell counts the criteria in one category that read one way. The counts are not added up across categories or readings."}
  report_summary_question: {register: C, text: "Posed as a question"}
  report_plan_heading: {register: A, text: "Action plan"}
  report_plan_intro: {register: A, text: "Criteria with something located, in the instrument's priority order and then by proposed band; a criterion the instrument gives no priority flag comes after the rest. Each code leads to the criterion's entry below."}
  report_plan_none: {register: A, text: "Nothing was located for any criterion, so there is no action plan to order."}
  report_col_located: {register: A, text: "Located"}
  report_col_where: {register: A, text: "In Canvas"}
  report_compact_heading: {register: A, text: "Every other criterion, one line each"}
  report_narrative_heading: {register: A, text: "Closing notes"}
  report_block_A: {register: A, text: "Counted by a parser"}
  report_block_B: {register: B, text: "Located in the course and quoted"}
  report_block_C: {register: C, text: "A question for the reviewer: your call"}
  report_block_D: {register: D, text: "Limits of this pass"}
  report_reading_question: {register: C, text: "No rating proposed: the reviewer's call"}
  report_no_check_ran: {register: D, text: "no check ran"}
  report_not_gathered: {register: B, text: "located evidence not gathered in this run"}
  report_nothing_to_link: {register: A, text: "No located item"}
  # A rating a reviewer recorded, in the exports (roadmap item 16, Q2). Only printed when one was.
  col_reviewer_rating: {register: A, text: "Reviewer's rating"}
  reviewer_none: {register: A, text: "No rating recorded by the reviewer"}
  # The heading the review screen shows the short agreement statement under (roadmap item 24).
  agreement_heading: {register: A, text: "How often two human reviewers choose the same rating"}
  report_reviewer_intro: {register: A, text: "Where the reviewer recorded a rating in Sightline, it is printed as the reviewer's rating beside the proposed rating. The proposed rating and its effort estimate are left exactly as the review pass made them."}
  # The review screen (roadmap item 16).
  review_lede: {register: A, text: "Each criterion with what the review pass located, its proposed rating, and a place to record yours. Nothing is run again here: the page reads the review file the run saved."}
  review_index_heading: {register: A, text: "Categories"}
  review_index_intro: {register: A, text: "The instrument's categories, in its own order. Each cell counts the criteria in one category with one proposed reading; the counts are not added up across categories or readings."}
  review_col_unresolved: {register: A, text: "Questions with no rating recorded"}
  review_jump_none: {register: A, text: "Every question posed in this review has a recorded rating."}
  review_export_heading: {register: A, text: "Export"}
  review_export_intro: {register: A, text: "Writes the PDF report and the workbook for this course, from the review file and the ratings recorded here. Where a rating was recorded, both carry it as the reviewer's rating beside the unchanged proposal."}
  review_export_button: {register: A, text: "Write the report and the workbook"}
  review_exported: {register: A, text: "Written. Each file carries the ratings recorded when it was written; write them again after recording another."}
  review_export_files: {register: A, text: "Files written for this course"}
  review_sort: {register: A, text: "Sort"}
  review_sort_instrument: {register: A, text: "Instrument order"}
  review_sort_severity: {register: A, text: "Priority, then proposed band"}
  review_filter_reading: {register: A, text: "Proposed reading"}
  review_filter_tier: {register: A, text: "Determinacy"}
  review_filter_any: {register: A, text: "Any"}
  review_filter_unresolved: {register: A, text: "Only questions with no rating recorded"}
  review_apply: {register: A, text: "Apply"}
  review_rows_none: {register: A, text: "No criterion in this category matches this view."}
  review_back: {register: A, text: "All categories"}
  review_unresolved: {register: C, text: "No rating recorded yet: the reviewer's call"}
  review_form_rating: {register: A, text: "Your rating"}
  review_form_note: {register: A, text: "Note"}
  review_form_submit: {register: A, text: "Record this rating"}
  review_form_hint_question: {register: C, text: "Nothing is selected. Choose a rating, No Response included, to record one; the call is yours to decide."}
  review_form_hint_proposal: {register: A, text: "The proposed rating is selected. Recording it unchanged, with or without a note, records that you confirmed it."}
  review_needs_reviewer: {register: A, text: "No reviewer name is set, so no rating can be recorded yet. Every recorded rating names who made it: set the name under Reviewer on the Settings screen."}
  review_settings_link: {register: A, text: "Go to Settings"}
  review_unknown_course: {register: A, text: "No course with this id is in the run store. A review is reached by the run-store course id that python -m sightline.batch status prints."}

A:
  # A Tier A row whose checks all ran, each examined something, and none recorded an observation.
  # The only shape that reads clean, and it always names what was examined (SPEC §11).
  clean:
    - "{code}: {checks} examined {examined} and found none of the conditions checked for."
    - "{code}: Sightline examined {examined} with {checks} and found none of the conditions checked."
    - "{code}: across {examined}, {checks} found none of the conditions checked for."
    - "For {code}, {checks} opened {examined} and found none of the conditions checked for."

  # A Tier A row whose checks recorded observations. Count, spread, and what was examined.
  findings:
    - "{code}: {checks} examined {examined} and recorded {found} in {artifacts}."
    - "{code}: {found} recorded in {artifacts}, from {examined} examined by {checks}."
    - "For {code}, {checks} examined {examined}, recording {found} in {artifacts}."
    - "{code}: {found} recorded in {artifacts}, of {examined} examined by {checks}."

  # A band on a Tier A row some of whose bindings were examined by nothing. It covers the rest.
  findings_partial:
    - "{tags} went unexamined in this review, so the band covers only what the other checks could see."
    - "Nothing in this review examined {tags}; the band covers only what the other checks could see."
    - "The band covers only what the other checks could see: {tags} went unexamined in this review."

  # Checks ran and something they opened could not be read, so nothing recorded is not clean.
  unreadable:
    - "{code}: {checks} examined {examined}, and {unreadable}. Recording nothing elsewhere does not establish the row, so it stays at {label}."
    - "{code}: of {examined} examined by {checks}, {unreadable}. The row stays at {label} until those are read."
    - "For {code}, {checks} examined {examined} and {unreadable}; the row stays at {label} rather than reading clean."

  # A bound check ran over nothing, or could not run at all.
  not_examined:
    - "{code}: {names} examined nothing in this review, so the row stays at {label}."
    - "{code} stays at {label}: {names} examined nothing in this review."
    - "For {code}, {names} examined nothing in this review; the row stays at {label}."

  # Some of a Tier A row's bindings ran clean and others were examined by nothing.
  partial:
    - "{code}: nothing in this review examined {tags}. The other checks recording nothing does not establish the row, so it stays at {label}."
    - "{code} stays at {label}: {tags} went unexamined in this review, and the rest recording nothing does not settle it."
    - "For {code}, {tags} went unexamined in this review; the row stays at {label} whatever the other checks recorded."

  # One line per check behind a row.
  check:
    - "{title} ({detector}): examined {examined} holding {subjects}; {found} recorded."
    - "{detector}, {title}: {examined} examined, holding {subjects}; {found} recorded."
    - "{title} ({detector}) examined {examined} holding {subjects} and recorded {found}."
  check_unreadable:
    - "{title} ({detector}): examined {examined} holding {subjects}; {found} recorded, and {unreadable}."
    - "{detector}, {title}: {examined} examined, holding {subjects}; {found} recorded; {unreadable}."
    - "{title} ({detector}) examined {examined} holding {subjects}, recorded {found}, and {unreadable}."
  check_not_examined:
    - "{title} ({detector}) examined nothing: {reason}"
    - "{detector}, {title}, examined nothing: {reason}"
    - "{title} ({detector}) did not examine anything: {reason}"
  check_crashed:
    - "{title} ({detector}) stopped with an error and examined nothing. The error is in the log, not here, because it can quote course content."
    - "{detector}, {title}, could not run: it stopped with an error, which is in the log rather than here because it can quote course content."
    - "{title} ({detector}) could not run, and the error it stopped with is in the log, not in this review, because it can quote course content."

  # One line per observation: where, and what was measured. {evidence} is the source as written.
  finding:
    - "{place}: {observed}."
    - "At {place}: {observed}."
    - "{place} — {observed}."
    - "In {place}: {observed}."
  finding_source:
    - "{place}: {observed}. The source reads “{evidence}”."
    - "At {place}: {observed}. As written: “{evidence}”."
    - "{place} — {observed}. Source: “{evidence}”."
    - "In {place}: {observed}. The course reads “{evidence}”."

  # The proposed band, and the hours behind it. While the cost table is uncalibrated, every variant
  # says the figure comes from a placeholder (roadmap items 12a and 12b).
  reading_placeholder:
    - "Proposed: {label}, from {hours} of estimated effort on a placeholder cost table that has not been calibrated."
    - "{label} is proposed, from {hours} of estimated effort; the cost table is a placeholder and has not been calibrated."
    - "Proposed {label}: {hours} of estimated effort, priced from a placeholder cost table not yet calibrated."
  reading_calibrated:
    - "Proposed: {label}, from {hours} of estimated effort on a cost table fitted to completed reviews."
    - "{label} is proposed, from {hours} of estimated effort on a cost table fitted to completed reviews."
    - "Proposed {label}: {hours} of estimated effort, priced from a cost table fitted to completed reviews."
  reading_clean:
    - "Proposed: {label}."
    - "{label} is proposed."
    - "Proposed reading: {label}."

B:
  # A Tier B row whose bound checks recorded observations. The band covers what the checks see.
  findings:
    - "{code}: {checks} examined {examined} and recorded {found} in {artifacts} bearing on this criterion. The band covers only what was checked; the located passages may add to it."
    - "{code}: {found} in {artifacts}, recorded by {checks} from {examined} examined. What was checked is part of this criterion, and the located passages may add to what needs doing."
    - "For {code}, {checks} recorded {found} in {artifacts} of {examined} examined. What was not checked is left to the located passages, so the band is a floor."

  # A Tier B row whose bound checks recorded nothing. That does not settle it.
  clean_checks:
    - "{code}: {checks} examined {examined} and recorded nothing. What was checked bears on this criterion without settling it, so it stays at {label} and the located passages are its evidence."
    - "{code} stays at {label}: {checks} examined {examined} and recorded nothing, which does not settle a criterion the checking only bears on."
    - "For {code}, {checks} examined {examined} with nothing recorded; that leaves the criterion open, and it stays at {label}."

  # Located evidence: what was searched, and how many quotes were checked against the source.
  quotes:
    - "{code}: searched {passages} in {examined}; Sightline located {quotes} bearing on this criterion and checked each against the source."
    - "{code}: {quotes} located in {passages} from {examined}, each checked word for word against the course."
    - "For {code}, Sightline searched {passages} in {examined} and located {quotes}, each matched against the source."
    - "{code}: of {passages} searched in {examined}, Sightline located {quotes} and matched each to the course text."
  quote:
    - "{place} states: “{quote}”"
    - "{place} reads: “{quote}”"
    - "In {place}: “{quote}”"
    - "{place}, as written: “{quote}”"
  quotes_none:
    - "{code}: searched {passages} in {examined}; no passage bearing on this criterion was located."
    - "{code}: no passage bearing on this criterion was located in {passages} from {examined}."
    - "For {code}, Sightline searched {passages} in {examined} and located no passage bearing on it."
  quotes_none_incomplete:
    - "{code}: {unread} of {passages} in {examined} could not be read, and no passage bearing on this criterion was located in the rest."
    - "{code}: no passage bearing on this criterion was located in what could be read; {unread} of {passages} in {examined} could not be read."
    - "For {code}, {unread} of {passages} in {examined} went unread, and the rest held no passage bearing on it."
  quotes_incomplete:
    - "{unread} of {passages} could not be read, so the quotes here may not be all there are."
    - "{unread} of {passages} went unread, and the course may hold more than is quoted here."
    - "The course may say more than is quoted: {unread} of {passages} could not be read."
  quotes_no_text:
    - "{code}: {examined} were opened for located evidence and none of them carried any text."
    - "{code}: none of the {examined} opened for located evidence carried any text."
    - "For {code}, the {examined} opened for located evidence held no text to search."
  quotes_nothing_examined:
    - "{code}: nothing of the kinds searched for located evidence was available in this course."
    - "{code}: no artifact of the kinds searched for located evidence was available in this course."
    - "For {code}, the course held nothing of the kinds searched for located evidence."
  quotes_not_run:
    - "{code}: located evidence for this row was not gathered in this run."
    - "{code}: this run did not gather located evidence for this row."
    - "For {code}, located evidence was not gathered in this run."

C:
  # The question. Distribution first, then the call handed over. Never a rating.
  question:
    - "{code}: Sightline located {quotes} across {artifacts} — {distribution}. Whether that answers the criterion is your call."
    - "{code}: in {artifacts}, Sightline located {quotes} ({distribution}). How they read against the criterion is for the reviewer to decide."
    - "For {code}, Sightline located {quotes} bearing on the criterion across {artifacts}: {distribution}. Reading them against it is yours to decide."
    - "{code}: {distribution}, {quotes} in all across {artifacts}. What they add up to against the criterion is the reviewer's call."
  question_none:
    - "{code}: no passage bearing on this criterion was located in {passages} from {examined}. What that means for the criterion is your call."
    - "{code}: Sightline searched {passages} in {examined} and located no passage bearing on it. How the criterion stands is for the reviewer to decide."
    - "For {code}, {passages} from {examined} held no passage bearing on the criterion; the call on it is yours to decide."
  question_none_incomplete:
    - "{code}: {unread} of {passages} in {examined} could not be read, and no passage bearing on this criterion was located in the rest. The criterion is your call."
    - "{code}: nothing bearing on this criterion was located in what could be read, and {unread} of {passages} in {examined} went unread. That is for the reviewer to weigh."
    - "For {code}, {unread} of {passages} in {examined} went unread and the rest held no passage bearing on it; the criterion is yours to decide."
  question_checks:
    - "{code}: {checks} examined {examined} and recorded {found}; {unreadable_count} could not be read. What that means for this criterion is your call."
    - "{code}: from {examined} examined by {checks}, {found} recorded and {unreadable_count} unread. How that bears on the criterion is for the reviewer to decide."
    - "For {code}, {checks} recorded {found} across {examined}, with {unreadable_count} unread. Weighing that against the criterion is yours to decide."
  question_incomplete:
    - "{unread} of {passages} could not be read, which is for the reviewer to weigh as well."
    - "{unread} of {passages} went unread; that is yours to weigh alongside what was located."
    - "Also for you to weigh: {unread} of {passages} could not be read."
  question_no_text:
    - "{code}: none of the {examined} opened for context carried any text. The criterion is your call."
    - "{code}: the {examined} opened for context held no text to search, so the criterion is for the reviewer to decide unaided."
    - "For {code}, the {examined} opened for context carried no text; the criterion is yours to decide."
  question_nothing_examined:
    - "{code}: the course held nothing of the kinds searched for context. The criterion is your call."
    - "{code}: nothing of the kinds searched for context was available, so the criterion is for the reviewer to decide unaided."
    - "For {code}, no artifact of the kinds searched for context was available; the criterion is yours to decide."
  question_not_run:
    - "{code}: context for this criterion was not gathered in this run, and it is your call."
    - "{code}: this run gathered no context for this criterion; it is for the reviewer to decide."
    - "For {code}, no context was gathered in this run; the criterion is yours to decide."

D:
  # A Tier D row: not determinable from course artifacts.
  limit:
    - "{code} cannot be determined from course materials, so it is left at {label} for a person to set."
    - "{code} is outside what course materials can show; it is left at {label} for a person to set."
    - "Course materials cannot answer {code}, so it is left at {label} for a person to set."

  # Coverage states. These three are the difference between a check that ran and found nothing, and
  # a row nothing examined. See `clean_wording` in register.yaml: none of these may read as clean.
  not_yet_implemented:
    - "{code}: no check in this build of Sightline examines {tags} yet, so nothing was computed for this row."
    - "{code}: {tags} has no check in this build of Sightline yet, and nothing was computed for this row."
    - "For {code}, nothing was computed: no check in this build of Sightline examines {tags} yet."
  no_deterministic_coverage:
    - "{code}: this rubric assigns no automated check to this row, so nothing was computed for it; its evidence is located passages."
    - "{code}: no automated check is assigned to this row in this rubric. Nothing was computed for it, and its evidence is located passages."
    - "For {code}, this rubric assigns no automated check, so nothing was computed and its evidence is located passages."
  unresolved:
    - "{code}: bound to {tags}, which nothing in this review examined, so nothing was computed for this row."
    - "{code}: nothing in this review examined {tags}, the capabilities bound to this row, so nothing was computed for it."
    - "For {code}, nothing was computed: nothing in this review examined {tags}."
  held:
    - "It stays at {label}, the instrument's default."
    - "The row stays at {label}, the instrument's default."
    - "It is left at {label}, the instrument's default."

  # The closing narrative's fourth slot. Each is a count and a list of codes, stated plainly.
  narrative_not_yet_implemented:
    - "No check in this build examines the capabilities bound to {rows} yet: {codes}."
    - "For {rows}, no check in this build examines the bound capabilities yet: {codes}."
    - "Nothing was computed for {rows}, whose capabilities have no check in this build yet: {codes}."
  narrative_unbound:
    - "Nothing automated in this rubric is assigned to {rows}; located passages are the evidence: {codes}."
    - "This rubric assigns no automated check to {rows}; their evidence is located passages: {codes}."
    - "Located passages are the only evidence for {rows}, to which this rubric assigns no automated check: {codes}."
  narrative_not_gathered:
    - "Located evidence was not gathered in this run for {rows}: {codes}."
    - "This run gathered no located evidence for {rows}: {codes}."
    - "This run did not gather the located evidence routed for {rows}: {codes}."
  narrative_judgement:
    - "Sightline proposes nothing on {rows} of pedagogical judgement; those are the reviewer's: {codes}."
    - "For {rows} of pedagogical judgement, Sightline assembles context and proposes nothing: {codes}."
    - "No proposal is made on {rows} of pedagogical judgement, which rest with the reviewer: {codes}."
  narrative_out_of_scope:
    - "Course materials cannot determine {rows} at all: {codes}."
    - "Course materials cannot answer {rows}: {codes}."
    - "Nothing in course materials can settle {rows}: {codes}."
  narrative_unread:
    - "Something bound to {rows} could not be read or examined nothing, so the instrument's default stands: {codes}."
    - "The instrument's default stands on {rows}, because something bound there could not be read or examined nothing: {codes}."
    - "For {rows}, a check could not read what it opened or examined nothing, and the instrument's default stands: {codes}."
  narrative_crashed:
    - "{checks} stopped with an error and examined nothing: {names}."
    - "{checks} could not run, having stopped with an error: {names}."
    - "An error stopped {checks} before examining anything: {names}."
  narrative_limits_none:
    - "Every row in this pass was reached by a check or by located evidence. What the checks see is still limited to what the course artifacts contain."
    - "Nothing in this pass went unreached by a check or by located evidence, and what the checks see is still limited to the course artifacts."
    - "Each row was reached by a check or by located evidence; the checks still see only what the course artifacts contain."

# The rest of the closing narrative. Declarative, from computed aggregates, in the register of
# Tier A. No sentence here judges the course as a whole: rows are listed by code, never summed.
narrative:
  strong:
    - "{label} is proposed on {rows}, whose checks examined the course and recorded nothing: {items}."
    - "The checks behind {rows} examined the course and recorded nothing, so {label} is proposed: {items}."
    - "{label} on {rows}, each examined with nothing recorded: {items}."
  strong_none:
    - "No row reads {label} on this pass."
    - "On this pass, no row reads {label}."
    - "This pass leaves no row at {label}."
  work:
    - "A revision band is proposed on {rows}. {groups}."
    - "On {rows}, a revision band is proposed. {groups}."
    - "Revision bands are proposed on {rows}. {groups}."
  work_none:
    - "No row carries a proposed revision band on this pass."
    - "This pass proposes a revision band on no row."
    - "On this pass, no row is proposed a revision band."
  first:
    - "In the instrument's priority order, then by band, start with {items}."
    - "Start with {items}, taken in the instrument's priority order and then by band."
    - "By the instrument's priority flag, then by band, the first rows are {items}."
  first_none:
    - "With no revision band proposed, there is no action-plan order to start from."
    - "No row has a proposed band, so there is no action-plan order to start from."
    - "There is no action-plan order to start from, since no row has a proposed band."
