# A SYNTHETIC THIRD-PARTY INSTRUMENT WITH NO BINDINGS AT ALL.
#
# This is the shape of a rubric somebody has just uploaded: their own rows, their own numbering,
# their own wording, and nothing mapped. **It is a success case, not a degraded one.** It loads,
# it runs, and every row comes back NO_DETERMINISTIC_COVERAGE and routed to the extraction layer
# for a located quote. Binding is an optimization, not a prerequisite, and requiring somebody to
# author forty bindings before their own rubric would work is a roadblock this project does not
# put in front of them — the more so because Sightline can never ship a pack for a proprietary
# instrument, so a third-party import is the only way those users exist at all.
#
# Nothing here is an OSCQR derivative, nothing carries an OPEN SUNY number, and nothing is
# crosswalked to 3.1.3. It is invented for the suite and traces to no real department.

