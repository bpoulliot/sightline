schema_version: 1
id: uccs-oscqr-3-1-3
name: UCCS OSCQR 3.1.3
version: 3.1.3
description: 'The University of Colorado Colorado Springs adaptation of OSCQR, at 68 criteria across seven
  categories. A local instrument, not stock SUNY OSCQR 4.0, and the reference rubric Sightline was built
  against — the reference, not the schema: nothing in Sightline requires another rubric to be expressed
  in terms of this one.'
source:
  title: UCCS OSCQR 3.1.3 — Instructional Designer
  workbook: UCCS OSCQR 3.1.3.xlsx
  sheet: Instructional Designer
  imported_at: '2026-09-17'
  key_source: category_and_index
  notes:
  - 'Join key: column F, 68 distinct value(s) over 68 row(s). Declared in uccs-oscqr-3-1-3.yaml and checked
    here; it is what a re-import of a revised edition diffs against, and it is carried on every row as
    source_ids.join_key.'
  - 9 row(s) carry no priority flag. Null, not a default — the flag is absent on the instrument.
  - 'uccs-oscqr-3-1-3.yaml bound 49 of 68 row(s) to a capability tag and left 19 unbound. An unbound row
    is normal and permanent: nothing computed bears on it, so its evidence is located and quoted instead.'
priority_order:
- Essential
- Important
rating_scale:
  sufficiently_present: Sufficiently Present
  not_applicable: Not Applicable
  no_response: No Response
  bands:
  - rating: minor
    label: Minor Revision
    up_to_hours: 0.5
    range_label: 1/2 hour or less
  - rating: moderate
    label: Moderate Revision
    up_to_hours: 2.0
    range_label: 1/2-2 hours
  - rating: major
    label: Major Revision
    up_to_hours: null
    range_label: 2+ hours
sections:
- code: COAL
  title: Course Alignment
- code: GSOV
  title: Getting Started and Overviews
- code: OREP
  title: Organization and Representation
- code: ACD
  title: Accessible Course Design
- code: ENIN
  title: Engagement and Interaction
- code: ASFE
  title: Assessment and Feedback
- code: MOB
  title: Mobile Standards
  optional: true
  note: The mobile standards are an integrated set and apply to a course reviewed for mobile delivery.
    A review may switch this section off; its rows are then reported as omitted.
