schema_version: 1
id: uccs-oscqr-rsi
name: UCCS OSCQR RSI Review
version: '2026.1'
description: A short-form review instrument of 18 criteria in six sections, used for regular and substantive
  interaction review. Structurally unlike the 68-criterion instrument beside it and complete on its own
  terms; it is not a subset of anything and is not read through another rubric.
source:
  title: UCCS OSCQR RSI Review — Course Review
  workbook: UCCS OSCQR RSI Review.xlsm
  sheet: Course Review
  imported_at: '2026-09-17'
  key_source: composite_code
  notes:
  - 'This workbook does not open in openpyxl''s default mode: TypeError: expected <class ''int''>. It
    was re-opened read-only, which does not bind merged cells; the criterion text is unaffected. Nothing
    here suppresses the error — an import that cannot read the file raises rather than returning an empty
    pack.'
  - 'Join key: column A, 18 distinct value(s) over 18 row(s). Declared in uccs-oscqr-rsi.yaml and checked
    here; it is what a re-import of a revised edition diffs against, and it is carried on every row as
    source_ids.join_key.'
  - 'The row codes are this instrument''s own sequential numbering, which is positional in substance:
    a revised edition that inserts a row renumbers everything after it, and a re-import will not diff
    cleanly against this one (SPEC §11). There is nothing to be done about that here — the instrument
    carries no stabler identifier — so it is stated rather than discovered later.'
  - No priority column was found, so every row's priority is null. Action-plan ordering tolerates that;
    it is not filled in with a default.
  - 'uccs-oscqr-rsi.yaml bound 14 of 18 row(s) to a capability tag and left 4 unbound. An unbound row
    is normal and permanent: nothing computed bears on it, so its evidence is located and quoted instead.'
rating_scale:
  sufficiently_present: Sufficiently Present
  not_applicable: Not Applicable
  no_response: No Response
  bands:
  - rating: minor
    label: Minor Revision
    up_to_hours: 0.5
    range_label: 1/2 hour or less
  - rating: moderate
    label: Moderate Revision
    up_to_hours: 2.0
    range_label: 1/2-2 hours
  - rating: major
    label: Major Revision
    up_to_hours: null
    range_label: 2+ hours
sections:
- code: '1'
  title: Course Alignment
- code: '2'
  title: Getting Started and Overviews
- code: '3'
  title: Organization and Representation
- code: '4'
  title: Accessible Course Design
- code: '5'
  title: Engagement and Interaction
- code: '6'
  title: Assessment and Feedback
criteria:
- code: '1'
  section: '1'
  text: Course objectives are clearly articulated, describe a single discrete behavior, support learner
    achievement of program objectives, and define the measurement of success.
  tier: B
  bindings:
  - outcomes_defined
  source_ids:
    row: 10
    join_key: '1'
    key: '1'
    index: '1'
- code: '2'
  section: '1'
  text: Assessments measure progress towards and/or achievement of module and course objectives.
  tier: B
  source_ids:
    row: 11
    join_key: '2'
    key: '2'
    index: '2'
- code: '3'
  section: '2'
  text: Course includes information about required technology tools (websites, software, and hardware),
    requisite skills for use, support resources, and links to privacy policies.
  tier: B
  bindings:
  - external_tool_inventory
  source_ids:
    row: 15
    join_key: '3'
    key: '3'
    index: '3'
- code: '4'
  section: '2'
  text: An overview is provided for the course overall and for each module that informs learners how to
    navigate, relevant course and module objectives, and what tasks are due.
  tier: B
  bindings:
  - module_overview
  source_ids:
    row: 16
    join_key: '4'
    key: '4'
    index: '4'
- code: '5'
  section: '3'
  text: Course offers access to a variety of learning material types (e.g., text, video, hyperdocs) that
    facilitate communication and collaboration, deliver content, and provide options for engagement.
  tier: A
  bindings:
  - material_type_variety
  source_ids:
    row: 20
    join_key: '5'
    key: '5'
    index: '5'
- code: '6'
  section: '4'
  text: Contrast between text and background colors in pages and any images is sufficient (text:background
    ratio of 4.5:1 for normal-sized text and 3:1 for large text greater than 18 point); text in documents
    (Word, PDF) uses sans serif font and size is at least 12 pt. Canvas does this automatically.
  tier: A
  bindings:
  - colour_contrast
  - type_size_and_family
  source_ids:
    row: 24
    join_key: '6'
    key: '6'
    index: '6'
- code: '7'
  section: '4'
  text: Content is properly formatted using preformatted styles (e.g., Title, Normal, H2, Paragraph),
    including all PDFs, slideshow presentations, Word documents, and HTML pages.
  tier: A
  bindings:
  - heading_structure
  - document_accessibility
  - text_as_image
  source_ids:
    row: 25
    join_key: '7'
    key: '7'
    index: '7'
- code: '8'
  section: '4'
  text: Hyperlinks use descriptive text instead of raw URLs or phrases such as “click here”.
  tier: A
  bindings:
  - link_text
  source_ids:
    row: 26
    join_key: '8'
    key: '8'
    index: '8'
- code: '9'
  section: '4'
  text: All text and images provide the same information when viewed with or without color and color alone
    is not used to convey meaning to learners in content or communication.
  tier: A
  bindings:
  - colour_as_sole_cue
  source_ids:
    row: 27
    join_key: '9'
    key: '9'
    index: '9'
- code: '10'
  section: '4'
  text: All video content includes accurate closed captioning (automatic captioning may require editing)
    and audio content is accompanied by a transcript, including all instructor-generated media.
  tier: A
  bindings:
  - captions_and_transcripts
  source_ids:
    row: 28
    join_key: '10'
    key: '10'
    index: '10'
- code: '11'
  section: '4'
  text: All activities and assessments include clear instructions, due dates, and submission guidelines
    (i.e., what is to be submitted, acceptable file formats, where to submit).
  tier: A
  bindings:
  - activity_instructions
  - due_date_coverage
  source_ids:
    row: 29
    join_key: '11'
    key: '11'
    index: '11'
- code: '12'
  section: '5'
  text: Learning materials, activities, and planned learner-instructor interactions integrate getting
    to know the instructor (e.g., personality, online presence)
  tier: B
  bindings:
  - instructor_presence
  source_ids:
    row: 33
    join_key: '12'
    key: '12'
    index: '12'
- code: '13'
  section: '5'
  text: Course contains activities intended to build a sense of class community, support open communication,
    and establish trust (e.g., class introductions, course questions discussion).
  tier: B
  bindings:
  - discussion_inventory
  source_ids:
    row: 34
    join_key: '13'
    key: '13'
    index: '13'
- code: '14'
  section: '5'
  text: Expectations for timely and regular interaction with the instructor are clearly stated (feedback,
    additional help, questions, mode preference).
  tier: B
  source_ids:
    row: 35
    join_key: '14'
    key: '14'
    index: '14'
- code: '15'
  section: '5'
  text: Course leverages varied types of activities and options for learners to engage with the instructor,
    their peers, and the content.
  tier: C
  source_ids:
    row: 36
    join_key: '15'
    key: '15'
    index: '15'
- code: '16'
  section: '5'
  text: Learning activities incorporate varied learner interactions (i.e., self-reflection, one-on-one,
    small group, whole class).
  tier: C
  source_ids:
    row: 37
    join_key: '16'
    key: '16'
    index: '16'
- code: '17'
  section: '6'
  text: Activities include evaluation criteria and clearly articulate expectations (e.g., rubrics, exemplars).
  tier: B
  bindings:
  - assignment_rubric_attached
  source_ids:
    row: 41
    join_key: '17'
    key: '17'
    index: '17'
- code: '18'
  section: '6'
  text: The course offers opportunities to provide formative feedback on the achievement of learning objectives
  tier: B
  bindings:
  - formative_opportunities
  source_ids:
    row: 42
    join_key: '18'
    key: '18'
    index: '18'
